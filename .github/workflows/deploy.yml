name: Publish Daybook website
on:
  push:
    branches: [main]
    paths: [index.html, flutter_bootstrap.js, site.zip, google_auth.js, vault_bridge.js, voice_notes.js, offline.js, daybook_offline_sw.js, transcription_worker.js, 'offline-assets.*', main.dart.js.gz, .github/workflows/deploy.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daybook-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract reviewed static website
        run: |
          mkdir website
          unzip -q site.zip -d website
          test -f website/index.html
          test -f website/main.dart.js
          cat offline-assets.part-* > offline-assets.zip
          sha256sum -c offline-assets.sha256
          unzip -oq offline-assets.zip -d website
          cp index.html flutter_bootstrap.js daybook_offline_sw.js website/
          cp google_auth.js vault_bridge.js voice_notes.js offline.js transcription_worker.js website/
          gzip -dc main.dart.js.gz > website/main.dart.js
          test -f website/canvaskit/canvaskit.wasm
          test -f website/assets/assets/fonts/DaybookSans-Regular.ttf
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - name: Publish
        id: publish
        uses: actions/deploy-pages@v4

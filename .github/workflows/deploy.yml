name: Publish Daybook website
on:
  push:
    branches: [main]
    paths: [index.html, flutter_bootstrap.js, site.zip, google_auth.js, vault_bridge.js, voice_notes.js, offline.js, daybook_offline_sw.js, transcription_worker.js, 'offline-assets.*', main.dart.js.gz, .github/workflows/deploy.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daybook-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract reviewed static website
        run: |
          mkdir website
          unzip -q site.zip -d website
          test -f website/index.html
          test -f website/main.dart.js
          cat offline-assets.part-* > offline-assets.zip
          sha256sum -c offline-assets.sha256
          unzip -oq offline-assets.zip -d website
          cp index.html flutter_bootstrap.js daybook_offline_sw.js website/
          cp google_auth.js vault_bridge.js voice_notes.js offline.js transcription_worker.js website/
          gzip -dc main.dart.js.gz > website/main.dart.js
          test -f website/canvaskit/canvaskit.wasm
          test -f website/assets/assets/fonts/DaybookSans-Regular.ttf
      - name: Verify offline release checksums
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('website')
          worker = (root / 'daybook_offline_sw.js').read_text()
          build, _ = json.JSONDecoder().raw_decode(worker.split('const BUILD = ', 1)[1])
          assert set(build['files']) == set(build['sha256'])
          for name, expected in build['sha256'].items():
              actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'Release asset checksum mismatch: {name}')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - name: Publish
        id: publish
        uses: actions/deploy-pages@v4
